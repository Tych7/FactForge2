<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>FactForge</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app">

    <section id="screen-join" class="screen">
      <img src="assets/bigLogo.svg" alt="FactForge" class="big-logo" />
      <label for="joinCode">Game code</label>
      <input id="joinCode" maxlength="5" autocomplete="off" placeholder="ABCDE" />
      <label for="playerName">Your name</label>
      <input id="playerName" maxlength="24" autocomplete="off" placeholder="Your name" />
      <button id="joinBtn">Join</button>
      <p id="joinError" class="error"></p>
    </section>

    <section id="screen-waiting" class="screen hidden">
      <h2>You're in!</h2>
      <p>Waiting for the host to start...</p>
    </section>

    <section id="screen-textslide" class="screen hidden">
      <h2>👀 Look at the main screen</h2>
    </section>

    <section id="screen-question" class="screen hidden">
      <div class="timer-bar-track"><div id="timerBar" class="timer-bar"></div></div>
      <h2 id="questionText"></h2>
      <div id="choices" class="choices"></div>
    </section>

    <section id="screen-music-question" class="screen hidden">
      <div class="timer-bar-track">
        <div id="musicTimerBar" class="timer-bar"></div>
      </div>

      <h2>🎵 Guess the song!</h2>

      <div class="music-answer-form">
        <label for="musicArtist">Artist</label>
        <input
          id="musicArtist"
          type="text"
          maxlength="100"
          autocomplete="off"
          placeholder="Artist"
        />

        <label for="musicTitle">Title</label>
        <input
          id="musicTitle"
          type="text"
          maxlength="100"
          autocomplete="off"
          placeholder="Song title"
        />

        <button id="musicSubmitBtn" type="button">
          Submit answer
        </button>
      </div>
    </section>

    <section id="screen-locked" class="screen hidden">
      <h2>Answer locked in</h2>
      <p>Waiting for the reveal...</p>
    </section>

    <section id="screen-reveal" class="screen hidden">
      <div id="revealIcon" class="reveal-icon"></div>

      <div id="musicRevealResults" class="music-reveal-results hidden">
        <div id="musicArtistResult" class="music-result"></div>
        <div id="musicTitleResult" class="music-result"></div>
      </div>

      <p id="revealRank" class="reveal-score"></p>
    </section>

    <section id="screen-ended" class="screen hidden">
      <h2>🏁 Quiz complete!</h2>
      <ol id="finalLeaderboard"></ol>
    </section>

  </main>

  <script src="signalr.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
